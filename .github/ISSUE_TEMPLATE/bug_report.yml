name: 🐛 Bug Report
description: Report an issue, crash, or unexpected behavior in QuickScan
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide detailed context to assist troubleshooting.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the unexpected behavior...
    validations:
      required: true
  - type: textarea
    id: repro-steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this behavior?
      placeholder: |
        1. Select folder '...'
        2. Expand tree node '...'
        3. Observe error '...'
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS version, .NET version, etc.
      placeholder: Windows 11 23H2 / .NET 10.0
    validations:
      required: false
  - type: textarea
    id: logs-screenshots
    attributes:
      label: Error Output / Logs / Screenshots
      description: Paste any error messages, exceptions, or screenshots here.
    validations:
      required: false
